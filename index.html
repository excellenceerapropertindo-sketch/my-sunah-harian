<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Sunah Harian</title>
</head>
<body>

  <h1>Dashboard Sunah Harian</h1>
  <div id="app"></div>

  <!-- Script Firebase Realtime Database -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Tempelkan firebaseConfig milik Anda di sini
    const firebaseConfig = {
      // PASTE KODE CONFIG DARI FIREBASE DI SINI
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Ambil data dari Firebase
    const dataRef = ref(db, '/');
    onValue(dataRef, (snapshot) => {
      const data = snapshot.val();
      console.log("Data Firebase berhasil diambil:", data);
    });
  </script>
</body>
</html>

<!-- Script Firebase Realtime Database -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // KODE CONFIGURASI FIREBASE
    const firebaseConfig = {
      databaseURL: "https://sunah-harian-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    // Inisialisasi Firebase App
    const app = initializeApp(firebaseConfig);
    
    // Menghubungkan ke Database dengan memberikan alamat URL-nya secara langsung
    const db = getDatabase(app, "https://sunah-harian-default-rtdb.asia-southeast1.firebasedatabase.app");

    // Ambil data dari Firebase
    const dataRef = ref(db, '/');
    onValue(dataRef, (snapshot) => {
      const data = snapshot.val();
      console.log("Data Firebase berhasil diambil:", data);
    });
  </script>
